<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材管理</title><style>:root{color-scheme:light;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--muted:#64748b;--red:#dc2626}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#1d4ed8 0,transparent 32%),radial-gradient(circle at 90% 90%,#0e7490 0,transparent 28%),linear-gradient(145deg,#071126,#101f46);color:#15213b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;padding:42px 20px 70px}h1{margin:0;text-align:center;color:#fff;font-size:clamp(26px,5vw,38px);letter-spacing:.04em}.lead{margin:8px 0 28px;text-align:center;color:#cbd5e1}.box,.item,.stat{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 18px 45px rgba(0,0,0,.2)}#login{max-width:500px;margin:28px auto}#panel>h2{color:#fff;margin-top:28px}.box h2{margin:0 0 14px;font-size:20px}.item{display:flex;align-items:center;gap:18px;margin:12px 0;padding:17px 19px}.material-info{flex:1}.material-info strong{display:block;font-size:16px;line-height:1.45}.upload-date{display:block;margin-top:5px;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{margin:0;padding:18px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;margin-top:5px;font-size:30px}.material-stat{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #e2e8f0}.material-stat:last-child{border-bottom:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}input,select,button{width:100%;font:inherit;padding:13px 14px;margin:7px 0;border-radius:11px}input,select{border:1px solid #cbd5e1;background:#fff;color:#172033;outline:none}input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.15)}input{cursor:text}select,button,.switch{cursor:pointer!important}button{border:0;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:750;box-shadow:0 8px 18px rgba(37,99,235,.24);transition:.16s}button:hover{transform:translateY(-2px);filter:brightness(1.05)}.secondary,.danger{width:auto;padding:10px 18px;box-shadow:none}.secondary{background:rgba(15,23,42,.75)}.danger{background:linear-gradient(135deg,#b91c1c,var(--red))}.switch{flex:0 0 108px;width:108px;margin:0;border-radius:999px;background:#64748b}.switch.on{background:linear-gradient(135deg,#15803d,#22c55e)}.msg{min-height:22px;margin:7px 2px 0;color:var(--muted);font-size:14px}.hide{display:none!important}@media(max-width:520px){main{padding:28px 14px 50px}.box{padding:18px}.item{align-items:flex-start;flex-direction:column}.switch{width:100%;flex-basis:auto}.stats{grid-template-columns:1fr}}</style></head><body><main><h1>🔬 教材管理コンソール</h1><p class="lead">公開設定と匿名の閲覧回数を確認できます。</p><section id="login" class="box"><h2>先生ログイン</h2><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><button id="loginButton" type="button">ログイン</button><p id="loginMsg" class="msg"></p></section><section id="panel" class="hide"><button class="secondary" onclick="logout()">ログアウト</button><h2>利用状況</h2><div class="stats"><div class="stat"><span>今日のアプリ閲覧</span><strong id="todayOpens">－</strong></div><div class="stat"><span>累計のアプリ閲覧</span><strong id="totalOpens">－</strong></div></div><div class="box"><h2>教材別の閲覧回数</h2><div id="materialStats"><p class="msg">集計を読み込んでいます…</p></div><div class="actions"><button class="secondary" type="button" onclick="loadStats()">集計を更新</button><button class="danger" type="button" onclick="resetStats()">閲覧回数をリセット</button></div><p id="statsMsg" class="msg">個人・端末を識別せず、回数だけを集計しています。</p></div><h2>公開設定</h2><div id="list"></div><div class="box"><h2>＋ 新しい教材</h2><input id="title" placeholder="教材名"><select id="category"><option>暗記シート</option><option>シミュレーション</option><option>問題演習</option><option>その他</option></select><input id="file" placeholder="ファイル名（例：sample.html）"><input id="description" placeholder="短い説明"><input id="icon" value="📘" placeholder="アイコン"><button onclick="addMaterial()">非公開で追加する</button><p id="addMsg" class="msg"></p></div></section></main><script>
const U="https://kcroxgnjjizugbwfkxbg.supabase.co",K="sb_publishable_B_kSeRc0HJ35NPjiGzwC1Q_mRQOnIvi";let token=sessionStorage.getItem("teacherToken"),materials=[];const H=()=>({apikey:K,Authorization:"Bearer "+token,"Content-Type":"application/json"});function formatDate(value){if(!value)return"日付未登録";return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"long",day:"numeric"}).format(new Date(value))}async function teacherLogin(){const msg=document.getElementById("loginMsg");msg.textContent="確認中…";try{const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})}),d=await r.json();if(!r.ok){msg.textContent="ログインできませんでした。メールアドレスとパスワードを確認してください。";return}token=d.access_token;sessionStorage.setItem("teacherToken",token);show()}catch(e){msg.textContent="Supabaseへ接続できませんでした。通信状態を確認してください。"}}function logout(){sessionStorage.removeItem("teacherToken");location.reload()}async function show(){document.getElementById("login").classList.add("hide");document.getElementById("panel").classList.remove("hide");await load();await loadStats()}async function load(){const r=await fetch(U+"/rest/v1/material_visibility?select=*&order=sort_order",{headers:H()});if(r.status===401)return logout();materials=await r.json();const list=document.getElementById("list");list.textContent="";materials.forEach(x=>{const d=document.createElement("div");d.className="item";const info=document.createElement("div"),s=document.createElement("strong"),date=document.createElement("span"),b=document.createElement("button");info.className="material-info";s.textContent=x.title;date.className="upload-date";date.textContent="アップロード日："+formatDate(x.uploaded_at);info.append(s,date);b.className="switch "+(x.is_public?"on":"");b.textContent=x.is_public?"公開":"非公開";b.onclick=()=>toggle(x.material_key,!x.is_public);d.append(info,b);list.appendChild(d)})}async function loadStats(){const msg=document.getElementById("statsMsg");msg.textContent="集計を更新しています…";const r=await fetch(U+"/rest/v1/rpc/get_usage_summary",{method:"POST",headers:H(),body:"{}"});if(!r.ok){msg.textContent="集計を読み込めませんでした。";return}const x=await r.json();document.getElementById("todayOpens").textContent=Number(x.today_opens||0).toLocaleString()+"回";document.getElementById("totalOpens").textContent=Number(x.total_opens||0).toLocaleString()+"回";const area=document.getElementById("materialStats");area.textContent="";const counts=new Map((x.materials||[]).map(v=>[v.material_key,Number(v.opens||0)]));materials.forEach(m=>{const d=document.createElement("div"),a=document.createElement("span"),b=document.createElement("strong");d.className="material-stat";a.textContent=m.title;b.textContent=(counts.get(m.material_key)||0).toLocaleString()+"回";d.append(a,b);area.appendChild(d)});msg.textContent="個人・端末を識別せず、回数だけを集計しています。"}async function resetStats(){
if(!confirm("すべての閲覧回数を削除します。元に戻せません。実行しますか？"))return;
const msg=document.getElementById("statsMsg");
msg.textContent="リセットしています…";
try{
 const r=await fetch(U+"/rest/v1/rpc/reset_usage_events",{method:"POST",headers:H(),body:"{}"});
 const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{data=null}
 if(!r.ok){msg.textContent="リセット失敗：HTTP "+r.status+" / "+(data?.code||"")+" / "+(data?.message||"応答を確認できませんでした")+(r.status===401?"。ログアウトして再ログインしてください。":"");return}
 await loadStats();
 msg.textContent=Number(data||0).toLocaleString()+"件の閲覧記録を削除しました。";
}catch(e){msg.textContent="リセット失敗：通信できませんでした。"}
}
async function toggle(key,value){const r=await fetch(U+"/rest/v1/material_visibility?material_key=eq."+encodeURIComponent(key),{method:"PATCH",headers:{...H(),Prefer:"return=minimal"},body:JSON.stringify({is_public:value,updated_at:new Date().toISOString()})});if(!r.ok)return alert("変更できませんでした。");load()}async function addMaterial(){const f=document.getElementById("file").value.trim();if(!document.getElementById("title").value.trim()||!/^[A-Za-z0-9_.-]+\.html$/.test(f)){document.getElementById("addMsg").textContent="教材名と、半角英数字の.htmlファイル名を確認してください。";return}const key=f.replace(/\.html$/i,"").replace(/[^A-Za-z0-9_]/g,"_");const r=await fetch(U+"/rest/v1/material_visibility",{method:"POST",headers:{...H(),Prefer:"return=minimal"},body:JSON.stringify({material_key:key,title:document.getElementById("title").value.trim(),category:document.getElementById("category").value,file_name:f,description:document.getElementById("description").value.trim(),icon:document.getElementById("icon").value||"📘",action_label:"学習する →",is_public:false,sort_order:Date.now(),uploaded_at:new Date().toISOString()})});if(!r.ok){document.getElementById("addMsg").textContent="追加できませんでした。ファイル名の重複を確認してください。";return}document.getElementById("addMsg").textContent="非公開で追加しました。";document.getElementById("title").value=document.getElementById("file").value=document.getElementById("description").value="";load();loadStats()}document.getElementById("loginButton").addEventListener("click",teacherLogin);if(token)show();
</script></body></html>
