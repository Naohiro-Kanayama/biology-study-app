<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材管理</title><style>:root{color-scheme:light;--navy:#0b1739;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#1d4ed8 0,transparent 32%),radial-gradient(circle at 90% 90%,#0e7490 0,transparent 28%),linear-gradient(145deg,#071126,#101f46);color:#15213b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;padding:42px 20px 70px}h1{margin:0;text-align:center;color:#fff;font-size:clamp(26px,5vw,38px);letter-spacing:.04em}.lead{margin:8px 0 28px;text-align:center;color:#cbd5e1}.box,.item{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 18px 45px rgba(0,0,0,.2);backdrop-filter:blur(12px)}#login{max-width:500px;margin:28px auto}#panel>h2{color:#fff;margin-top:28px}.box h2{margin:0 0 14px;font-size:20px}.item{display:flex;align-items:center;gap:18px;margin:12px 0;padding:17px 19px}.item strong{flex:1;font-size:16px;line-height:1.45}input,select,button{width:100%;font:inherit;padding:13px 14px;margin:7px 0;border-radius:11px}input,select{border:1px solid #cbd5e1;background:#fff;color:#172033;outline:none}input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.15)}input{cursor:text}select,button,.switch{cursor:pointer!important}button{border:0;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:750;box-shadow:0 8px 18px rgba(37,99,235,.24);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}button:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(37,99,235,.34);filter:brightness(1.05)}button:active{transform:translateY(0)}.secondary{width:auto;padding:10px 18px;background:rgba(15,23,42,.75);box-shadow:none}.switch{flex:0 0 108px;width:108px;margin:0;border-radius:999px;background:#64748b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}.switch.on{background:linear-gradient(135deg,#15803d,#22c55e)}.msg{min-height:22px;margin:7px 2px 0;color:var(--muted);font-size:14px}.hide{display:none!important}@media(max-width:520px){main{padding:28px 14px 50px}.box{padding:18px}.item{align-items:flex-start;flex-direction:column}.switch{width:100%;flex-basis:auto}}</style></head><body><main><h1>🔬 教材管理コンソール</h1><p class="lead">生物学習アプリの公開状態を、ここから簡単に切り替えられます。</p><section id="login" class="box"><h2>先生ログイン</h2><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><button id="loginButton" type="button">ログイン</button><p id="loginMsg" class="msg"></p></section><section id="panel" class="hide"><button class="secondary" onclick="logout()">ログアウト</button><h2>公開設定</h2><div id="list"></div><div class="box"><h2>＋ 新しい教材</h2><input id="title" placeholder="教材名"><select id="category"><option>暗記シート</option><option>シミュレーション</option><option>問題演習</option><option>その他</option></select><input id="file" placeholder="ファイル名（例：sample.html）"><input id="description" placeholder="短い説明"><input id="icon" value="📘" placeholder="アイコン"><button onclick="addMaterial()">非公開で追加する</button><p id="addMsg" class="msg"></p></div></section></main><script>
const U="https://kcroxgnjjizugbwfkxbg.supabase.co",K="sb_publishable_B_kSeRc0HJ35NPjiGzwC1Q_mRQOnIvi";let token=sessionStorage.getItem("teacherToken");const H=()=>({apikey:K,Authorization:"Bearer "+token,"Content-Type":"application/json"});async function teacherLogin(){const msg=document.getElementById("loginMsg");msg.textContent="確認中…";try{const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})}),d=await r.json();if(!r.ok){msg.textContent="ログインできませんでした。メールアドレスとパスワードを確認してください。";return}token=d.access_token;sessionStorage.setItem("teacherToken",token);show()}catch(e){msg.textContent="Supabaseへ接続できませんでした。通信状態を確認してください。"}}function logout(){sessionStorage.removeItem("teacherToken");location.reload()}async function show(){document.getElementById("login").classList.add("hide");document.getElementById("panel").classList.remove("hide");await load()}async function load(){const r=await fetch(U+"/rest/v1/material_visibility?select=*&order=sort_order",{headers:H()});if(r.status===401)return logout();const rows=await r.json();document.getElementById("list").textContent="";rows.forEach(x=>{const d=document.createElement("div");d.className="item row";const s=document.createElement("strong"),b=document.createElement("button");s.textContent=x.title;b.className="switch "+(x.is_public?"on":"");b.textContent=x.is_public?"公開":"非公開";b.onclick=()=>toggle(x.material_key,!x.is_public);d.append(s,b);document.getElementById("list").appendChild(d)})}async function toggle(key,value){const r=await fetch(U+"/rest/v1/material_visibility?material_key=eq."+encodeURIComponent(key),{method:"PATCH",headers:{...H(),Prefer:"return=minimal"},body:JSON.stringify({is_public:value,updated_at:new Date().toISOString()})});if(!r.ok)return alert("変更できませんでした。");load()}async function addMaterial(){const f=document.getElementById("file").value.trim();if(!document.getElementById("title").value.trim()||!/^[A-Za-z0-9_.-]+\.html$/.test(f)){document.getElementById("addMsg").textContent="教材名と、半角英数字の.htmlファイル名を確認してください。";return}const key=f.replace(/\.html$/i,"").replace(/[^A-Za-z0-9_]/g,"_");const r=await fetch(U+"/rest/v1/material_visibility",{method:"POST",headers:{...H(),Prefer:"return=minimal"},body:JSON.stringify({material_key:key,title:document.getElementById("title").value.trim(),category:document.getElementById("category").value,file_name:f,description:document.getElementById("description").value.trim(),icon:document.getElementById("icon").value||"📘",action_label:"学習する →",is_public:false,sort_order:Date.now()})});if(!r.ok){document.getElementById("addMsg").textContent="追加できませんでした。ファイル名の重複を確認してください。";return}document.getElementById("addMsg").textContent="非公開で追加しました。";document.getElementById("title").value=document.getElementById("file").value=document.getElementById("description").value="";load()}document.getElementById("loginButton").addEventListener("click",teacherLogin);if(token)show();
</script></body></html>
