<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>チロキシン分泌の調節</title>
<style>
:root{color-scheme:light;--background:#f7fafc;--foreground:#172033;--card:#ffffff;--card-foreground:#172033;--muted:#e9eef5;--muted-foreground:#526176;--border:#cad4e0;--primary:#23406f;--primary-foreground:#ffffff;--accent:#e8f0ff;--accent-foreground:#172033;--destructive:#b3261e;--blue:#1769e0;--orange:#d76816;--green:#16825d;--purple:#7653c6;--viz-series-1:#1769e0;--viz-series-2:#7653c6;--viz-series-3:#d76816;--font-size-base:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic",sans-serif}main{max-width:900px;margin:0 auto}.viz-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{appearance:none;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--foreground);padding:9px 14px;font:inherit;cursor:pointer}.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 35%,transparent);outline-offset:2px}.text-small{font-size:13px}h2{font-size:clamp(20px,3vw,28px);margin:0 0 14px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--background:#111722;--foreground:#f4f7fb;--card:#1a2331;--card-foreground:#f4f7fb;--muted:#253143;--muted-foreground:#b8c4d5;--border:#435168;--primary:#a9c5ff;--primary-foreground:#10213f;--accent:#293a56;--accent-foreground:#f4f7fb;--blue:#6aa3ff;--orange:#ffad66;--green:#62d6a8;--purple:#bca6ff}}
</style>
</head>
<body>
<main><div id="thyroid-feedback-lab">
  <style>
    #thyroid-feedback-lab{color:var(--foreground);font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic",sans-serif} #thyroid-feedback-lab .viz-controls{margin-bottom:10px}
    #thyroid-feedback-lab .diagram{width:100%;height:auto;display:block} #thyroid-feedback-lab .organ{cursor:pointer}
    #thyroid-feedback-lab .backdrop{fill:color-mix(in srgb,var(--muted) 26%,transparent)}
    #thyroid-feedback-lab .gridline{stroke:color-mix(in srgb,var(--border) 45%,transparent);stroke-width:1}
    #thyroid-feedback-lab .organ-box{fill:color-mix(in srgb,var(--green) 9%,var(--card));stroke:var(--green);stroke-width:2.5;filter:url(#tfl-shadow)}
    #thyroid-feedback-lab .hypo .organ-box,#thyroid-feedback-lab .pit .organ-box,#thyroid-feedback-lab .thy .organ-box{stroke:var(--green)}
    #thyroid-feedback-lab .organ text{fill:var(--foreground);text-anchor:start;font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic",sans-serif;font-size:18px;font-weight:500;letter-spacing:.04em;pointer-events:none}
    #thyroid-feedback-lab .organ .role{fill:var(--green);font-size:11px;font-weight:500;letter-spacing:.12em}
    #thyroid-feedback-lab .organ-icon{fill:color-mix(in srgb,var(--muted) 50%,transparent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    #thyroid-feedback-lab .detail{fill:none;stroke:var(--muted-foreground);stroke-width:1.4;stroke-linecap:round;pointer-events:none}
    #thyroid-feedback-lab .highlight{fill:var(--orange);stroke:var(--background);stroke-width:2;pointer-events:none}
    #thyroid-feedback-lab .hypo .organ-icon{stroke:var(--viz-series-1)} #thyroid-feedback-lab .pit .organ-icon{stroke:var(--viz-series-2)} #thyroid-feedback-lab .thy .organ-icon{stroke:var(--viz-series-3)}
    #thyroid-feedback-lab .hormone-box{fill:color-mix(in srgb,var(--orange) 10%,var(--card));stroke:var(--orange);stroke-width:2.5;filter:url(#tfl-shadow)}
    #thyroid-feedback-lab .hormone-text{fill:var(--foreground);font-family:"BIZ UDPMincho","Yu Mincho","YuMincho",serif;font-size:16px;font-weight:500} #thyroid-feedback-lab .thyroxine{fill:color-mix(in srgb,var(--orange) 12%,var(--card));stroke:var(--orange);stroke-width:2.5}
    #thyroid-feedback-lab .thyroxine-text{fill:var(--foreground);text-anchor:middle;font-family:"BIZ UDPMincho","Yu Mincho","YuMincho",serif;font-size:19px;font-weight:500}
    #thyroid-feedback-lab .flow-shape{stroke:var(--background);stroke-width:4;stroke-linejoin:round;paint-order:stroke fill;filter:url(#tfl-blue-glow);transition:opacity .25s ease}
    #thyroid-feedback-lab .flow-v{fill:url(#tfl-flow-v)} #thyroid-feedback-lab .flow-h{fill:url(#tfl-flow-h)}
    #thyroid-feedback-lab .motion-path{fill:none;stroke:transparent;pointer-events:none}
    #thyroid-feedback-lab .feedback{fill:none;stroke:var(--purple);stroke-width:3;stroke-dasharray:7 6;filter:url(#tfl-soft-glow)}
    #thyroid-feedback-lab .flow-shape.off{fill:color-mix(in srgb,var(--blue) 22%,var(--background));opacity:.3;filter:none} #thyroid-feedback-lab .feedback.off{opacity:.18;filter:none}
    #thyroid-feedback-lab .feedback-label{fill:var(--foreground);font-size:15px;font-weight:500;text-anchor:middle}
    #thyroid-feedback-lab .step{fill:var(--foreground)} #thyroid-feedback-lab .step-text{fill:var(--background);text-anchor:middle;font-size:13px;font-weight:500}
    #thyroid-feedback-lab .signal-tag{fill:var(--orange);font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic",sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em}
    #thyroid-feedback-lab .dot-one,#thyroid-feedback-lab .dot-two,#thyroid-feedback-lab .dot-three{display:none} #thyroid-feedback-lab .dot-feedback{fill:var(--purple);filter:url(#tfl-soft-glow)}
    #thyroid-feedback-lab .feedback-target{fill:color-mix(in srgb,var(--purple) 18%,transparent);stroke:var(--purple);stroke-width:2;transform-box:fill-box;transform-origin:center}
    #thyroid-feedback-lab .feedback-target.off{opacity:.15}
    #thyroid-feedback-lab .feedback-target:not(.off){animation:tfl-target 1.7s ease-in-out infinite}
    #thyroid-feedback-lab .block-gate{display:none} #thyroid-feedback-lab .block-gate.show{display:block}
    #thyroid-feedback-lab .gate-ring{fill:color-mix(in srgb,var(--foreground) 10%,transparent);stroke:var(--foreground);stroke-width:3}
    #thyroid-feedback-lab .gate-bar{stroke:var(--foreground);stroke-width:8;stroke-linecap:round}
    #thyroid-feedback-lab .gate-text{fill:var(--foreground);font-size:10px;font-weight:500;letter-spacing:1px;text-anchor:middle}
    @keyframes tfl-target{0%,100%{transform:scale(.82);opacity:.35}50%{transform:scale(1.15);opacity:1}}
    #thyroid-feedback-lab .stopped{visibility:hidden} #thyroid-feedback-lab .is-blocked .organ-box{fill:url(#tfl-stop-pattern);stroke:var(--foreground)}
    #thyroid-feedback-lab .organ .cross{display:none;fill:var(--foreground);font-size:28px;text-anchor:middle} #thyroid-feedback-lab .is-blocked .cross{display:block}
    #thyroid-feedback-lab .status{margin-top:8px;text-align:center} #thyroid-feedback-lab .hint{margin-top:5px;color:var(--muted-foreground);text-align:center}
    @media(max-width:520px){#thyroid-feedback-lab .organ text,#thyroid-feedback-lab .thyroxine-text{font-size:15px}#thyroid-feedback-lab .hormone-text,#thyroid-feedback-lab .feedback-label{font-size:12px}#thyroid-feedback-lab .step-text{font-size:12px}}
    @media(prefers-reduced-motion:reduce){#thyroid-feedback-lab .moving-dot{display:none}#thyroid-feedback-lab .flow-shape{fill:var(--blue)}}
  </style>
  <h2>チロキシン分泌の調節</h2>
  <div class="viz-controls"><button type="button" class="btn btn-primary" id="tfl-normal">正常に戻す</button></div>
  <svg class="diagram" viewBox="0 0 760 610" role="img" aria-labelledby="tfl-title tfl-desc">
    <title id="tfl-title">チロキシン分泌の調節</title><desc id="tfl-desc">視床下部、脳下垂体前葉、甲状腺と、チロキシンから上流へ戻る二つの抑制経路。器官を選ぶと下流が止まる。</desc>
    <defs>
      <marker id="tfl-ao" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M1 1L13 7L1 13L4 7Z" fill="var(--blue)"/></marker>
      <marker id="tfl-ai" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="2.25" markerHeight="2.25" orient="auto"><path d="M2.5 3L11 7L2.5 11L5 7Z" fill="var(--background)"/></marker>
      <marker id="tfl-af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--purple)"/></marker>
      <filter id="tfl-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="var(--foreground)" flood-opacity=".12"/></filter>
      <filter id="tfl-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="tfl-blue-glow" x="-45%" y="-45%" width="190%" height="190%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="var(--blue)" flood-opacity=".7"/></filter>
      <filter id="tfl-soft-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <pattern id="tfl-stop-pattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--card)"/><rect width="3" height="10" fill="color-mix(in srgb,var(--foreground) 14%,transparent)"/></pattern>
      <linearGradient id="tfl-stripe-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".45"/><stop offset=".24" stop-color="var(--blue)" stop-opacity="1"/><stop offset=".5" stop-color="var(--blue)" stop-opacity=".55"/><stop offset=".76" stop-color="var(--blue)" stop-opacity="1"/><stop offset="1" stop-color="var(--blue)" stop-opacity=".45"/></linearGradient>
      <linearGradient id="tfl-stripe-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--blue)" stop-opacity=".45"/><stop offset=".24" stop-color="var(--blue)" stop-opacity="1"/><stop offset=".5" stop-color="var(--blue)" stop-opacity=".55"/><stop offset=".76" stop-color="var(--blue)" stop-opacity="1"/><stop offset="1" stop-color="var(--blue)" stop-opacity=".45"/></linearGradient>
      <pattern id="tfl-flow-v" width="760" height="52" patternUnits="userSpaceOnUse"><rect width="760" height="52" fill="url(#tfl-stripe-v)"/><animateTransform attributeName="patternTransform" type="translate" from="0 -52" to="0 0" dur="1.1s" repeatCount="indefinite"/></pattern>
      <pattern id="tfl-flow-h" width="64" height="610" patternUnits="userSpaceOnUse"><rect width="64" height="610" fill="url(#tfl-stripe-h)"/><animateTransform attributeName="patternTransform" type="translate" from="-64 0" to="0 0" dur="1.1s" repeatCount="indefinite"/></pattern>
    </defs>
    <rect class="backdrop" x="15" y="10" width="730" height="575" rx="24"/>
    <g aria-hidden="true" opacity=".75"><path class="gridline" d="M40 145H720M40 345H720M40 545H720M300 30V565M590 30V565"/><circle class="gridline" cx="590" cy="70" r="4"/><circle class="gridline" cx="590" cy="270" r="4"/><circle class="gridline" cx="300" cy="545" r="4"/></g>
    <path class="flow-shape flow-v" data-flow="0" d="M160 135H190V170H207L175 205L143 170H160Z"/><path id="tfl-p1" class="motion-path" d="M175 135L175 198"/>
    <path class="flow-shape flow-v" data-flow="1" d="M160 335H190V370H207L175 405L143 370H160Z"/><path id="tfl-p2" class="motion-path" d="M175 335L175 398"/>
    <path class="flow-shape flow-h" data-flow="2" d="M313 460H440V442L485 475L440 508V490H313Z"/><path id="tfl-p3" class="motion-path" d="M315 475L477 475"/>
    <path id="tfl-f-hypo" class="feedback" d="M610 430C675 370 680 75 305 70" marker-end="url(#tfl-af)"/><path id="tfl-f-pit" class="feedback" d="M610 430C650 390 650 270 305 270" marker-end="url(#tfl-af)"/>

    <circle class="feedback-target" data-target="pit" cx="304" cy="270" r="13"/><text x="304" y="275" text-anchor="middle" fill="var(--purple)" font-size="16" font-weight="500">−</text>

  <div class="status" id="tfl-status" aria-live="polite">正常：①～③の分泌と④の抑制が働いています。</div><div class="hint text-small">視床下部・脳下垂体前葉・甲状腺を押すと、その地点を停止できます。</div>
  <script>
    (()=>{const root=document.getElementById('thyroid-feedback-lab'),organs=[...root.querySelectorAll('.organ')],dots=[root.querySelector('.dot-one'),root.querySelector('.dot-two'),root.querySelector('.dot-three')],flowShapes=[...root.querySelectorAll('.flow-shape')],feedback=[...root.querySelectorAll('.dot-feedback')],feedbackPaths=[root.querySelector('#tfl-f-hypo'),root.querySelector('#tfl-f-pit')],feedbackTargets=[...root.querySelectorAll('.feedback-target')],gates=[...root.querySelectorAll('.block-gate')],status=root.querySelector('#tfl-status'),blocked=new Set(),labels={hypothalamus:'視床下部',pituitary:'脳下垂体前葉',thyroid:'甲状腺'};
    function refresh(){organs.forEach(o=>{const off=blocked.has(o.dataset.node);o.classList.toggle('is-blocked',off);o.setAttribute('aria-pressed',String(off));o.setAttribute('aria-label',`${labels[o.dataset.node]}を${off?'再開':'停止'}`)});gates.forEach(g=>g.classList.toggle('show',blocked.has(g.dataset.gate)));const h=blocked.has('hypothalamus'),p=blocked.has('pituitary'),t=blocked.has('thyroid'),off=[h,h||p,h||p||t],feedbackOff=h||p||t;dots.forEach((d,i)=>d.classList.toggle('stopped',off[i]));flowShapes.forEach((shape,i)=>shape.classList.toggle('off',off[i]));feedback.forEach(d=>d.classList.toggle('stopped',feedbackOff));feedbackPaths.forEach(path=>path.classList.toggle('off',feedbackOff));feedbackTargets.forEach(target=>target.classList.toggle('off',feedbackOff));if(!blocked.size){status.textContent='正常：①～③の分泌と④の抑制が働いています。';return}const first=['hypothalamus','pituitary','thyroid'].find(k=>blocked.has(k)),effect=first==='hypothalamus'?'①が遮断され、②・③・④も続いて停止します。':first==='pituitary'?'②が遮断され、③・④も続いて停止します。':'③が遮断され、チロキシンから戻る④も停止します。';status.textContent=`遮断：${labels[first]}。${effect}`}
    function toggle(o){const k=o.dataset.node;blocked.has(k)?blocked.delete(k):blocked.add(k);refresh()}root.querySelectorAll('.organ .role').forEach(role=>role.textContent='内分泌腺');organs.forEach(o=>{o.addEventListener('click',()=>toggle(o));o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(o)}})});root.querySelector('#tfl-normal').addEventListener('click',()=>{blocked.clear();refresh()});refresh()})();
  </script>
