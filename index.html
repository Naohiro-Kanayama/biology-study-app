<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png"><title>生物学習アプリ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f8;color:#222}header{background:#fff;border-bottom:1px solid #ddd;padding:30px 20px;text-align:center}h1{margin:0;font-size:28px}main{max-width:760px;margin:auto;padding:24px 16px 48px}section{margin-bottom:28px}h2{font-size:20px;margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;box-shadow:0 2px 8px #0000000d}.icon{font-size:36px}.title{font-size:20px;font-weight:700;margin-top:10px}.desc{color:#666;margin-top:8px;line-height:1.6;font-size:14px}.badge{display:inline-block;margin-top:12px;padding:4px 9px;border-radius:999px;background:#eee;font-size:12px}.message{background:#fff;border-radius:12px;padding:18px;color:#666}</style></head><body><header><h1>🧬 生物学習アプリ</h1></header><main id="main"><p class="message">教材を読み込んでいます…</p></main><script>
const U="https://kcroxgnjjizugbwfkxbg.supabase.co",K="sb_publishable_B_kSeRc0HJ35NPjiGzwC1Q_mRQOnIvi";
async function recordHomeView(){
try{
 const r=await fetch(U+"/rest/v1/rpc/record_usage_event",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({p_event_type:"app_open",p_material_key:null}),keepalive:true});
 if(!r.ok){let d={};try{d=await r.json()}catch{}

 }else{showCountStatus("");}
}catch{showCountStatus("閲覧回数を記録できませんでした（通信エラー）。教材は利用できます。");}

function showCountStatus(text){
 let p=document.getElementById("countStatus");
 if(!p){p=document.createElement("p");p.id="countStatus";p.style.cssText="max-width:760px;margin:0 auto;padding:8px 16px;font-size:12px;color:#64748b";document.body.appendChild(p)}
 p.textContent=text;p.hidden=!text;

window.addEventListener("pageshow",recordHomeView);
function safeFile(v){return /^[A-Za-z0-9_.-]+\.html$/.test(v)?v:""}function safeKey(v){return /^[A-Za-z0-9_.-]+$/.test(v)?v:""}function render(rows){const main=document.getElementById("main");main.textContent="";const groups={};rows.filter(x=>x.is_public).forEach(x=>(groups[x.category]??=[]).push(x));const icons={"暗記シート":"📚","シミュレーション":"🔬","問題演習":"✏️","その他":"📘"};for(const [category,items] of Object.entries(groups)){const s=document.createElement("section"),h=document.createElement("h2"),g=document.createElement("div");h.textContent=(icons[category]||"📘")+" "+category;g.className="grid";items.sort((a,b)=>a.sort_order-b.sort_order).forEach(x=>{const file=safeFile(x.file_name),key=safeKey(x.material_key);if(!file||!key)return;const a=document.createElement("a");a.className="card";a.href="open.html?file="+encodeURIComponent(file)+"&key="+encodeURIComponent(key);for(const [c,t] of [["icon",x.icon||"📘"],["title",x.title],["desc",x.description||""],["badge",x.action_label||"学習する →"]]){const d=document.createElement("div");d.className=c;d.textContent=t;a.appendChild(d)}g.appendChild(a)});s.append(h,g);main.appendChild(s)}if(!main.children.length)main.innerHTML='<p class="message">現在公開中の教材はありません。</p>'}
fetch(U+"/rest/v1/material_visibility?select=*&order=sort_order",{headers:{apikey:K}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(x=>{sessionStorage.setItem("materials",JSON.stringify(x));render(x)}).catch(()=>{const x=sessionStorage.getItem("materials");document.getElementById("main").innerHTML=x?"":'<p class="message">教材を読み込めませんでした。通信状態を確認してください。</p>';if(x)render(JSON.parse(x))});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
