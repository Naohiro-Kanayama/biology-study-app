<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物学習アプリ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:30px 20px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:28px;
}
main{
  max-width:760px;
  margin:0 auto;
  padding:24px 16px 48px;
}
h2{
  font-size:20px;
  margin:10px 0 16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}
.card{
  display:block;
  text-decoration:none;
  color:inherit;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:22px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  transition:transform .15s,box-shadow .15s;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 16px rgba(0,0,0,.10);
}
.icon{font-size:36px}
.title{
  font-size:20px;
  font-weight:700;
  margin-top:10px;
}
.desc{
  color:#666;
  margin-top:8px;
  line-height:1.6;
  font-size:14px;
}
.badge{
  display:inline-block;
  margin-top:12px;
  padding:4px 9px;
  border-radius:999px;
  background:#eee;
  font-size:12px;
}
</style>
</head>
<body>
<header>
  <h1>🧬 生物学習アプリ</h1>
</header>

<main>
  <h2>📚 暗記シート</h2>

  <div class="grid">
    <a class="card" href="hormone_anki_sheet.html">
      <div class="icon">🧪</div>
      <div class="title">ホルモン</div>
      <div class="desc">紙の暗記シートを使ったデジタル赤シート学習</div>
      <span class="badge">学習する →</span>
    </a>
  </div>
</main>
</body>
</html>
